modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/seacucu/GuidebookFixes/issues"

[[mods]]
modId = "guidebookfixes"
version = "${file.jarVersion}"
displayName = "Guidebook Fixes"
authors = "seacucu"
# Purely cosmetic, client-side, and safe to have on only one side of a connection.
# Forge accepts MATCH_VERSION / IGNORE_SERVER_VERSION / IGNORE_ALL_VERSION / NONE;
# anything else fails mod construction outright with "Invalid displayTest value".
displayTest = "IGNORE_ALL_VERSION"
description = '''
Repairs in-game guidebooks that break inside modpacks.

- Line breaking for Chinese, Japanese and Korean in books that wrap text by
  splitting on spaces, which leaves CJK paragraphs running off the page.
- Recipe pages that reference a recipe id the modpack removed or replaced:
  the page falls back to whatever recipe currently produces the item, and says
  so plainly when the modpack removed it outright, instead of printing an
  untranslated error string.

Every fix only activates when the mod that owns the book is installed.
'''

[[dependencies.guidebookfixes]]
    modId = "forge"
    mandatory = true
    versionRange = "[47,)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.guidebookfixes]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1,1.21)"
    ordering = "NONE"
    side = "CLIENT"

# The mods this one patches are deliberately NOT listed as dependencies. Such
# an entry would only do two things: order mod construction (Mixins are applied
# long before that, so it buys nothing) and gate on a version range. The gate
# costs real failures: a mod whose version string is not plain Maven refuses to
# match any range and takes the whole game down at load. Patchouli reports
# "1.20.1-84.1-FORGE", which matches neither [84,) nor anything else sane.
#
# Whether a mod is installed is what actually matters, and MixinPlugin answers
# that without caring about version strings.
